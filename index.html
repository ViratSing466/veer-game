  W=canvas.width=window.innerWidth;

/* ================= AUDIO ================= */

let audioCtx=null;
let audioReady=false;
let musicTimer=null;
let musicStep=0;
let masterGain=null;

const audioHint=document.getElementById("audioHint");

function initAudio(){
  if(audioReady)return;

  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();

    masterGain=audioCtx.createGain();
    masterGain.gain.value=.16;
    masterGain.connect(audioCtx.destination);

    audioReady=true;
    audioHint.style.display="none";

    startMusic();
  }catch(err){
    console.log("Audio unavailable",err);
  }
}

function tone(frequency,duration,type="sine",volume=.08,delay=0){
  if(!audioReady)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;

  osc.frequency.setValueAtTime(
    frequency,
    audioCtx.currentTime+delay
  );

  gain.gain.setValueAtTime(
    .0001,
    audioCtx.currentTime+delay
  );

  gain.gain.exponentialRampToValueAtTime(
    Math.max(.0001,volume),
    audioCtx.currentTime+delay+.015
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    audioCtx.currentTime+delay+duration
  );

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start(audioCtx.currentTime+delay);
  osc.stop(audioCtx.currentTime+delay+duration+.03);
}

function fluteNote(freq,duration=.5,volume=.035){
  if(!audioReady)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="triangle";
  osc.frequency.setValueAtTime(freq,audioCtx.currentTime);

  gain.gain.setValueAtTime(.0001,audioCtx.currentTime);

  gain.gain.linearRampToValueAtTime(
    volume,
    audioCtx.currentTime+.08
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start();
  osc.stop(audioCtx.currentTime+duration+.05);
}

function drum(freq=90,volume=.045){
  if(!audioReady)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="sine";
  osc.frequency.setValueAtTime(freq,audioCtx.currentTime);

  osc.frequency.exponentialRampToValueAtTime(
    45,
    audioCtx.currentTime+.18
  );

  gain.gain.setValueAtTime(volume,audioCtx.currentTime);

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    audioCtx.currentTime+.2
  );

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start();
  osc.stop(audioCtx.currentTime+.22);
}

function startMusic(){
  if(!audioReady||musicTimer)return;

  const notes=[
    261.63,
    293.66,
    329.63,
    392,
    329.63,
    293.66,
    261.63,
    220
  ];

  musicTimer=setInterval(()=>{
    if(!audioReady)return;

    const note=notes[musicStep%notes.length];

    fluteNote(note,.65,.025);

    if(musicStep%4===0){
      tone(130.81,.8,"sine",.018);
      tone(196,.8,"sine",.012);
      drum(80,.035);
    }

    if(musicStep%4===2){
      drum(125,.022);
    }

    musicStep++;
  },620);
}

function sfxShoot(type){
  if(!audioReady)return;

  if(type==="laser"){
    tone(900,.055,"sawtooth",.045);
  }
  else if(type==="meteor"||type==="rocket"){
    tone(110,.12,"sawtooth",.055);
  }
  else if(type==="ultimate"){
    tone(700,.08,"triangle",.05);
    tone(980,.1,"triangle",.04,.04);
  }
  else if(type==="freeze"||type==="nova"){
    tone(1100,.1,"sine",.035);
  }
  else{
    tone(420,.07,"square",.025);
  }
}

function sfxHit(){
  tone(150,.06,"square",.025);
}

function sfxKill(){
  tone(620,.08,"triangle",.035);
  tone(880,.12,"triangle",.025,.05);
}

function sfxExplosion(){
  tone(90,.25,"sawtooth",.06);

}

function sfxDamage(){

}

function sfxBoss(){

function sfxBossAttack(){

}

/*
  CURRENT VERSION WAS 10% BUFFED.

  New VEER power:
  1.10 × 1.10 = 1.21

  So VEER is now 10% stronger
  than the previous version.
*/

const VEER_BUFF=1.21;

function getWeaponStats(index){

  const w=weapons[index];
  const u=weaponUpgrades[index];

  return{
    damage:w.damage*VEER_BUFF+u.damageBonus,
    fireRate:(w.fireRate/VEER_BUFF)*u.fireMult
  };
}

function applyCurrentWeaponStats(){

  const index=weapons.indexOf(currentWeapon);

  const stats=getWeaponStats(index);

  player.damage=stats.damage;
  player.fireRate=stats.fireRate;
}

/* ================= HELPERS ================= */

function rand(a,b){
  return Math.random()*(b-a)+a;
}

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function burst(x,y,color,count=10,power=250){

  if(particles.length>700){
    particles.splice(
      0,
      Math.min(100,particles.length-600)
    );
  }

  for(let i=0;i<count;i++){

    particles.push({
      x,
      y,
      vx:rand(-power,power),
      vy:rand(-power,power),
      life:rand(.25,.9),
      maxLife:.9,
      size:rand(2,8),
      color
    });
  }
}

function textPop(x,y,text,color="#fff"){
  floatingTexts.push({
    x,
    y,
    text,
    color,
    life:1
  });
}

/* ================= ENEMY SPAWN ================= */

function spawnEnemy(){

  const roll=Math.random();

  let type;

  if(roll<.42)type="grunt";
  else if(roll<.63)type="ranged";
  else if(roll<.78)type="assassin";
  else if(roll<.93)type="brute";
  else type="tank";

  const base=enemyTypes[type];

  const scale=1+(level-1)*.50;

  const side=Math.floor(Math.random()*4);

  let x,y;

  if(side===0){
    x=rand(0,5000);
    y=80;
  }
  else if(side===1){
    x=4920;
    y=rand(0,5000);
  }
  else if(side===2){
    x=rand(0,5000);
    y=4920;
  }
  else{
    x=80;
    y=rand(0,5000);
  }

  enemies.push({
    type,
    x,
    y,
    hp:base.hp*scale,
    maxHp:base.hp*scale,
    speed:base.speed,
    radius:base.radius,
    damage:base.damage*scale,
    ranged:!!base.ranged,
    shootTimer:rand(1,3),
    hitFlash:0,
    frozen:0,
    burning:0
  });
}


/* ================= BULLETS ================= */

function createBullet(angle,extra={}){

  const w=currentWeapon;

  bullets.push({

    x:player.x+Math.cos(angle)*32,
    y:player.y+Math.sin(angle)*32,

    vx:Math.cos(angle)*w.bulletSpeed,
    vy:Math.sin(angle)*w.bulletSpeed,

    damage:getWeaponStats(
      weapons.indexOf(currentWeapon)
    ).damage,

    radius:w.radius,
    life:2,
    color:w.color,
    type:w.type,
    splash:w.splash||0,
    angle,
    ...extra
  });
}

function shoot(){

  if(player.fireTimer>0)return;

  const w=currentWeapon;

  const tx=
    mouseX-W/2+camera.x;

  const ty=
    mouseY-H/2+camera.y;

  const angle=
    Math.atan2(
      ty-player.y,
      tx-player.x
    );

  if(w.type==="twin"){

    createBullet(angle-.09);
    createBullet(angle+.09);

  }
  else if(w.type==="ultimate"){

    createBullet(angle);
    createBullet(angle-.18);
    createBullet(angle+.18);

  }
  else if(w.type==="star"){

    createBullet(angle,{split:true});

  }
  else if(w.type==="galaxy"){

    createBullet(angle,{orbit:true});

  }
  else{

    createBullet(angle);

  }

  player.fireTimer=player.fireRate;

  burst(
    player.x+Math.cos(angle)*35,
    player.y+Math.sin(angle)*35,
    w.color,
    8,
    170
  );

  sfxShoot(w.type);
}

/* ================= DELAYED ATTACKS ================= */

function updateDelayedAttacks(dt){

  for(let i=delayedAttacks.length-1;i>=0;i--){

    const a=delayedAttacks[i];

    a.timer-=dt;

    if(a.timer<=0){

      if(a.type==="lava"){

        for(const pos of a.positions){

          burst(
            pos.x,
            pos.y,
            "#ff4b25",
            25,
            450
          );

          const d=
            Math.hypot(
              player.x-pos.x,
              player.y-pos.y
            );

          if(
            d<70 &&
            gameRunning &&
            !choiceOpen
          ){
            damagePlayer(a.damage*2);
          }
        }

        sfxExplosion();
      }

      delayedAttacks.splice(i,1);
    }
  }
}

/* ================= UPDATE PLAYER ================= */

function updatePlayer(dt){

  let dx=0;
  let dy=0;

  if(keys["w"]||keys["arrowup"])dy--;
  if(keys["s"]||keys["arrowdown"])dy++;
  if(keys["a"]||keys["arrowleft"])dx--;
  if(keys["d"]||keys["arrowright"])dx++;

  if(dx||dy){

    const len=Math.hypot(dx,dy);

    dx/=len;
    dy/=len;

    player.x+=
      dx*player.speed*dt;

    player.y+=
      dy*player.speed*dt;
  }

  player.x=clamp(
    player.x,
    player.radius,
    WORLD_WIDTH-player.radius
  );

  player.y=clamp(
    player.y,
    player.radius,
    WORLD_HEIGHT-player.radius
  );

  player.fireTimer=
    Math.max(
      0,
      player.fireTimer-dt
    );

  if(
    mouseDown &&
    !choiceOpen &&
    gameRunning
  ){
    shoot();
  }
}


/* ================= UPDATE BULLETS ================= */

function updateBullets(dt){

  for(let i=bullets.length-1;i>=0;i--){

    const b=bullets[i];

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

    b.life-=dt;

    if(
      b.life<=0||
      b.x<0||
      b.y<0||
      b.x>WORLD_WIDTH||
      b.y>WORLD_HEIGHT
    ){

      bullets.splice(i,1);
      continue;
    }

    if(b.orbit){

      for(let s=0;s<2;s++){

        const a=
          performance.now()/500+
          s*Math.PI;

        particles.push({
          x:b.x+Math.cos(a)*18,
          y:b.y+Math.sin(a)*18,
          vx:0,
          vy:0,
          life:.12,
          maxLife:.12,
          size:3,
          color:"#f0a0ff"
        });
      }
    }

    let hit=false;

    for(let j=enemies.length-1;j>=0;j--){

      const e=enemies[j];

      const d=
        Math.hypot(
          b.x-e.x,
          b.y-e.y
        );

      if(d<b.radius+e.radius){

        e.hp-=b.damage;
        e.hitFlash=.1;

        burst(
          b.x,
          b.y,
          b.color,
          7,
          160
        );

        sfxHit();

        if(b.type==="freeze"){
          e.frozen=2;
        }

        if(b.type==="burn"){
          e.burning=3;
        }

        if(b.type==="gravity"){

          for(const other of enemies){

            const od=
              Math.hypot(
                other.x-b.x,
                other.y-b.y
              );

            if(od<220){

              const gx=
                (b.x-other.x)/
                Math.max(od,1);

              const gy=
                (b.y-other.y)/
                Math.max(od,1);

              other.x+=gx*80;
              other.y+=gy*80;
            }
          }
        }

        if(b.splash>0){

          burst(
            b.x,
            b.y,
            b.color,
            25,
            350
          );

          for(let k=enemies.length-1;k>=0;k--){

            if(k===j)continue;

            const other=enemies[k];

            const sd=
              Math.hypot(
                b.x-other.x,
                b.y-other.y
              );

            if(sd<b.splash){

              other.hp-=b.damage*.45;

              if(other.hp<=0){
                killEnemy(k);
              }
            }
          }

          sfxExplosion();
        }

        if(b.split){

          for(let s=-2;s<=2;s++){

            const a=
              Math.atan2(b.vy,b.vx)+
              s*.28;

            bullets.push({
              x:b.x,
              y:b.y,
              vx:Math.cos(a)*900,
              vy:Math.sin(a)*900,
              damage:b.damage*.28,
              radius:4,
              life:.7,
              color:"#fff4a0",
              type:"fragment",
              splash:0,
              angle:a
            });
          }
        }

        if(
          b.type==="chain"||
          b.type==="chain2"
        ){

          let closest=null;
          let closestDist=250;

          for(const other of enemies){

            if(other===e)continue;

            const cd=
              Math.hypot(
                other.x-e.x,
                other.y-e.y
              );

            if(cd<closestDist){

              closestDist=cd;
              closest=other;
            }
          }

          if(closest){

            closest.hp-=b.damage*.55;

            lightningEffects.push({
              x:e.x,
              y:e.y,
              tx:closest.x,
              ty:closest.y,
              life:.25
            });
          }
        }

        if(b.type==="rocket"){

          let target=null;
          let best=500;

          for(const other of enemies){

            const od=
              Math.hypot(
                other.x-b.x,
                other.y-b.y
              );

            if(od<best){

              best=od;
              target=other;
            }
          }

          if(target){
            target.hp-=b.damage*.25;
          }
        }

        if(e.hp<=0){
          killEnemy(j);
        }

        hit=true;
        break;
      }
    }

    if(!hit&&boss){

      const d=
        Math.hypot(
          b.x-boss.x,
          b.y-boss.y
        );

      if(d<b.radius+boss.radius){

        damageBoss(b.damage);

        if(b.splash>0){

          burst(
            b.x,
            b.y,
            b.color,
            35,
            400
          );
        }

        hit=true;
      }
    }

    if(hit){
      bullets.splice(i,1);
    }
  }
}


/* ================= UPDATE ENEMIES ================= */

function updateEnemies(dt){

  for(let i=enemies.length-1;i>=0;i--){

    const e=enemies[i];

    if(e.frozen>0){
      e.frozen-=dt;
    }

    if(e.burning>0){

      e.burning-=dt;
      e.hp-=70*dt;

      if(e.hp<=0){

        killEnemy(i);
        continue;
      }
    }

    const dx=player.x-e.x;
    const dy=player.y-e.y;

    const d=
      Math.hypot(dx,dy)||1;

    const speed=
      e.speed*
      (e.frozen>0?.25:1);

    if(e.ranged){

      if(d>430){

        e.x+=
          dx/d*speed*dt;

        e.y+=
          dy/d*speed*dt;
      }
      else if(d<300){

        e.x-=
          dx/d*speed*dt;

        e.y-=
          dy/d*speed*dt;
      }

      e.shootTimer-=dt;

      if(e.shootTimer<=0){

        enemyShoot(e);
        e.shootTimer=1.8;
      }

    }
    else{

      e.x+=
        dx/d*speed*dt;

      e.y+=
        dy/d*speed*dt;
    }

    if(d<e.radius+player.radius){

      damagePlayer(
        e.damage*dt
      );
    }

    e.x=clamp(
      e.x,
      30,
      WORLD_WIDTH-30
    );

    e.y=clamp(
      e.y,
      30,
      WORLD_HEIGHT-30
    );

    e.hitFlash=
      Math.max(
        0,
        e.hitFlash-dt
      );
  }
}


/* ================= ENEMY BULLETS ================= */

function updateEnemyBullets(dt){

  for(let i=enemyBullets.length-1;i>=0;i--){

    const b=enemyBullets[i];

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

    b.life-=dt;

    const d=
      Math.hypot(
        b.x-player.x,
        b.y-player.y
      );

    if(d<b.radius+player.radius){

      damagePlayer(b.damage);

      burst(
        b.x,
        b.y,
        b.color||"#ff743d",
        14,
        240
      );

      enemyBullets.splice(i,1);
      continue;
    }

    if(b.life<=0){
      enemyBullets.splice(i,1);
    }
  }
}


/* ================= UPDATE BOSS ================= */

function updateBoss(dt){

  if(!boss||gameEnded)return;

  const dx=player.x-boss.x;
  const dy=player.y-boss.y;

  const d=
    Math.hypot(dx,dy)||1;

  boss.x+=
    dx/d*boss.speed*dt;

  boss.y+=
    dy/d*boss.speed*dt;

  boss.rotation+=dt;

  boss.shootTimer-=dt;
  boss.specialTimer-=dt;

  if(boss.shootTimer<=0){

    const angle=
      Math.atan2(dy,dx);

    const count=
      boss.phase===2?7:5;

    for(let i=0;i<count;i++){

      const offset=
        (i-(count-1)/2)*.13;

      enemyBullets.push({

        x:boss.x,
        y:boss.y,

        vx:
          Math.cos(angle+offset)*570,

        vy:
          Math.sin(angle+offset)*570,

        damage:boss.damage,

        life:4,

        radius:
          boss.phase===2?10:8,

        color:boss.color
      });
    }

    boss.shootTimer=
      boss.phase===2
      ?.715
      :1.045;
  }

  if(boss.specialTimer<=0){

    bossSpecial();

    boss.specialTimer=
      boss.phase===2
      ?2.53
      :4.07;
  }

  if(d<boss.radius+player.radius){

    damagePlayer(
      boss.damage*dt
    );
  }

  boss.hitFlash=
    Math.max(
      0,
      boss.hitFlash-dt
    );
}


/* ================= SPAWNING ================= */

function updateSpawning(dt){

  if(bossActive||gameEnded)return;

  spawnTimer-=dt;

  if(spawnTimer<=0){

    const amount=
      Math.min(
        16,
        4+Math.floor(level*.8)
      );

    for(let i=0;i<amount;i++){

      if(enemies.length<120){
        spawnEnemy();
      }
    }

    spawnTimer=
      Math.max(
        .12,
        .43-(level-1)*.025
      );
  }
}


/* ================= EFFECT UPDATES ================= */

function updateShockwaves(dt){

  for(let i=shockwaves.length-1;i>=0;i--){

    const s=shockwaves[i];

    s.radius+=
      (s.max/s.life)*dt;

    s.life-=dt;

    if(s.life<=0){
      shockwaves.splice(i,1);
    }
  }
}

function updateWarnings(dt){

  for(let i=warningZones.length-1;i>=0;i--){

    warningZones[i].life-=dt;

    if(warningZones[i].life<=0){
      warningZones.splice(i,1);
    }
  }
}

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vx*=Math.pow(.035,dt);
    p.vy*=Math.pow(.035,dt);

    p.life-=dt;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function updateLightning(dt){

  for(let i=lightningEffects.length-1;i>=0;i--){

    lightningEffects[i].life-=dt;

    if(lightningEffects[i].life<=0){
      lightningEffects.splice(i,1);
    }
  }
}

function updateFloatingTexts(dt){

  for(let i=floatingTexts.length-1;i>=0;i--){

    const t=floatingTexts[i];

    t.y-=40*dt;
    t.life-=dt;

    if(t.life<=0){
      floatingTexts.splice(i,1);
    }
  }
}

function updateCamera(){

  camera.x=
    clamp(
      player.x,
      W/2,
      WORLD_WIDTH-W/2
    );

  camera.y=
    clamp(
      player.y,
      H/2,
      WORLD_HEIGHT-H/2
    );
}


/* ================= DRAW WORLD ================= */

function drawWorld(){

  ctx.fillStyle="#080b15";
  ctx.fillRect(0,0,W,H);

  ctx.save();

  ctx.translate(
    Math.round(W/2-camera.x),
    Math.round(H/2-camera.y)
  );

  ctx.fillStyle="#10182a";

  ctx.fillRect(
    0,
    0,
    WORLD_WIDTH,
    WORLD_HEIGHT
  );

  ctx.strokeStyle=
    "rgba(90,130,200,.09)";

  ctx.lineWidth=1;

  for(
    let x=0;
    x<=WORLD_WIDTH;
    x+=100
  ){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,WORLD_HEIGHT);
    ctx.stroke();
  }

  for(
    let y=0;
    y<=WORLD_HEIGHT;
    y+=100
  ){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(WORLD_WIDTH,y);
    ctx.stroke();
  }

  ctx.strokeStyle="#405277";
  ctx.lineWidth=12;

  ctx.strokeRect(
    20,
    20,
    WORLD_WIDTH-40,
    WORLD_HEIGHT-40
  );

  for(const o of obstacles){

    ctx.fillStyle="#151e31";
    ctx.strokeStyle="#33425f";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
      o.x,
      o.y,
      o.r,
      0,
      Math.PI*2
    );

    ctx.fill();
    ctx.stroke();
  }

  ctx.restore();
}


/* ================= WARNINGS ================= */

function drawWarnings(){

  for(const z of warningZones){

    const sx=
      z.x-camera.x+W/2;

    const sy=
      z.y-camera.y+H/2;

    ctx.save();

    ctx.globalAlpha=
      .35+
      Math.sin(performance.now()/80)*.15;

    ctx.strokeStyle=z.color;
    ctx.fillStyle=z.color;
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.arc(
      sx,
      sy,
      z.radius,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.globalAlpha=.12;

    ctx.fill();

    ctx.restore();
  }
}

/* ================= PLAYER DRAW ================= */

function drawPlayer(){

  const sx=
    player.x-camera.x+W/2;

  const sy=
    player.y-camera.y+H/2;

  ctx.save();

  ctx.beginPath();

  ctx.ellipse(
    sx,
    sy+25,
    28,
    10,
    0,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#0009";
  ctx.fill();

  const g=
    ctx.createRadialGradient(
      sx-9,
      sy-13,
      3,
      sx,
      sy,
      36
    );

  g.addColorStop(0,"#82eaff");
  g.addColorStop(.5,"#2878bd");
  g.addColorStop(1,"#10243d");

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.arc(
    sx,
    sy,
    player.radius,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle="#b8efff";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.fillStyle="#172338";

  ctx.beginPath();

  ctx.arc(
    sx,
    sy-8,
    21,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#ffd0a8";

  ctx.beginPath();

  ctx.arc(
    sx,
    sy-1,
    13,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    sx-5,
    sy-3,
    2.6,
    0,
    Math.PI*2
  );

  ctx.arc(
    sx+5,
    sy-3,
    2.6,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.arc(
    sx-4.2,
    sy-3.8,
    .8,
    0,
    Math.PI*2
  );

  ctx.arc(
    sx+5.8,
    sy-3.8,
    .8,
    0,
    Math.PI*2
  );

  ctx.fill();

  const wx=
    mouseX-W/2+camera.x;

  const wy=
    mouseY-H/2+camera.y;

  const angle=

      wy-player.y,
      wx-player.x
    );

  ctx.translate(sx,sy);

  drawWeaponModel();

  ctx.restore();

}


/* ================= ENEMY DRAW ================= */

function drawEnemy(e){

  const sx=
    e.x-camera.x+W/2;

  const sy=
    e.y-camera.y+H/2;

  ctx.save();

  ctx.shadowBlur=18;

  ctx.shadowColor=
    e.hitFlash>0
    ?"white"
    :enemyTypes[e.type].color;

  const g=
    ctx.createRadialGradient(
      sx-e.radius*.3,
      sy-e.radius*.3,
      3,
      sx,
      sy,
      e.radius
    );

  g.addColorStop(
    0,
    e.hitFlash>0
    ?"white"
    :enemyTypes[e.type].color
  );

  g.addColorStop(1,"#090d18");

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.arc(
    sx,
    sy,
    e.radius,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#ffffff55";
  ctx.lineWidth=2;

  ctx.stroke();

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    sx-e.radius*.3,
    sy-e.radius*.1,
    4,
    0,
    Math.PI*2
  );

  ctx.arc(
    sx+e.radius*.3,
    sy-e.radius*.1,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();

  const bw=e.radius*2.2;

  ctx.fillStyle="#000a";

  ctx.fillRect(
    sx-bw/2,
    sy-e.radius-12,
    bw,
    5
  );

  ctx.fillStyle=
    e.burning>0
    ?"orange"
    :e.frozen>0
    ?"cyan"
    :"#52ed76";

  ctx.fillRect(
    sx-bw/2,
    sy-e.radius-12,
    bw*Math.max(
      0,
      e.hp/e.maxHp
    ),
    5
  );

  ctx.restore();
}

  const sy=

  ctx.translate(sx,sy);
  ctx.rotate(boss.rotation);

    boss.phase===2?11:8;

    0,
    boss.radius+22,

    Math.PI*2
  );

    boss.phase===2?5:3;

  if(type===7){

    ctx.strokeStyle="#42f2ff";
    ctx.lineWidth=8;

    ctx.strokeRect(
      -85,
      -85,
      170,
      170
    );

    ctx.strokeStyle="#fff";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(0,-85);
    ctx.lineTo(0,-135);

    ctx.stroke();

    ctx.fillStyle="#ff405e";

    ctx.beginPath();

    ctx.arc(
      0,
      -140,
      8,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  if(type===8){

    ctx.strokeStyle="#ffe15b";
    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.arc(
      0,
      -20,
      115,
      Math.PI,
      Math.PI*2
    );

    ctx.stroke();

    ctx.strokeStyle="#fff4a0";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      135,
      -.8,
      .8
    );

    ctx.stroke();
  }

  if(type===9){

    ctx.fillStyle="#ffdb42";

    ctx.beginPath();

    ctx.moveTo(-75,-65);
    ctx.lineTo(-55,-135);
    ctx.lineTo(-15,-85);
    ctx.lineTo(0,-150);
    ctx.lineTo(20,-85);
    ctx.lineTo(65,-135);
    ctx.lineTo(78,-65);

    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#fff4a0";

    ctx.beginPath();

    ctx.moveTo(0,-115);
    ctx.lineTo(20,-95);
    ctx.lineTo(0,-75);
    ctx.lineTo(-20,-95);

    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle=
    boss.phase===2
    ?"red"
    :"#ffff62";

  ctx.fillRect(
    -45,
    -17,
    30,
    11
  );

  ctx.fillRect(
    15,
    -17,
    30,
    11
  );

  ctx.fillStyle="#111";

  ctx.fillRect(
    -31,
    -14,
    7,
    6
  );

  ctx.fillRect(
    29,
    -14,
    7,
    6
  );

  ctx.fillStyle="#fff";

  ctx.font=
    boss.typeIndex===9
    ?"48px Arial"
    :"42px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    boss.emoji,
    0,
    62
  );

  ctx.restore();

  const bw=220;

  ctx.fillStyle="#000d";

  ctx.fillRect(
    sx-bw/2,
    sy-boss.radius-38,
    bw,
    12
  );

  ctx.fillStyle=
    boss.phase===2
    ?"orange"
    :"#ff3030";

  ctx.fillRect(
    sx-bw/2,
    sy-boss.radius-38,
    bw*
      Math.max(
        0,
        boss.hp/boss.maxHp
      ),
    12
  );
}


/* ================= STAR ================= */

function drawStar(
  x,
  y,
  outer,
  inner
){

  ctx.beginPath();

  for(let i=0;i<10;i++){

    const a=
      -Math.PI/2+
      i*Math.PI/5;

    const r=
      i%2===0
      ?outer
      :inner;

    const px=
      x+Math.cos(a)*r;

    const py=
      y+Math.sin(a)*r;

    if(i===0){
      ctx.moveTo(px,py);
    }
    else{
      ctx.lineTo(px,py);
    }
  }

  ctx.closePath();
  ctx.fill();
}


/* ================= BULLET DRAW ================= */

function drawBullets(){

  for(const b of bullets){

    const sx=
      b.x-camera.x+W/2;

    const sy=
      b.y-camera.y+H/2;

    ctx.save();

    ctx.translate(sx,sy);

    const angle=
      b.angle||
      Math.atan2(b.vy,b.vx);

    ctx.rotate(angle);

    ctx.shadowBlur=24;
    ctx.shadowColor=b.color;

    ctx.fillStyle=b.color;
    ctx.strokeStyle=b.color;

    if(
      b.type==="normal"||
      b.type==="fragment"
    ){

      ctx.beginPath();

      ctx.roundRect(
        -b.radius*1.7,
        -b.radius,
        b.radius*3.4,
        b.radius*2
      );

      ctx.fill();

      if(b.type==="fragment"){

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
          0,
          0,
          2,
          0,
          Math.PI*2
        );

        ctx.fill();
      }
    }

    else if(
      b.type==="chain"||
      b.type==="chain2"
    ){

      ctx.lineWidth=4;

      ctx.beginPath();

      ctx.moveTo(-12,0);
      ctx.lineTo(-5,-7);
      ctx.lineTo(2,7);
      ctx.lineTo(9,-6);
      ctx.lineTo(15,0);

      ctx.stroke();

      ctx.fillStyle="#fff";

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        3,
        0,
        Math.PI*2
      );

      ctx.fill();
    }

    else if(b.type==="explosive"){

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.strokeStyle="#fff";
      ctx.lineWidth=2;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius+6,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    else if(b.type==="burn"){

      ctx.beginPath();

      ctx.moveTo(
        b.radius*1.8,
        0
      );

      ctx.lineTo(
        -b.radius,
        -b.radius
      );

      ctx.lineTo(
        -b.radius*.4,
        0
      );

      ctx.lineTo(
        -b.radius,
        b.radius
      );

      ctx.closePath();
      ctx.fill();
    }

    else if(b.type==="freeze"){

      ctx.beginPath();

      for(let i=0;i<6;i++){

        const a=
          i*Math.PI/3;

        const x=
          Math.cos(a)*
          b.radius*1.5;

        const y=
          Math.sin(a)*
          b.radius*1.5;

        if(i===0){
          ctx.moveTo(x,y);
        }
        else{
          ctx.lineTo(x,y);
        }
      }

      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle="#fff";
      ctx.lineWidth=2;
      ctx.stroke();
    }

    else if(b.type==="gravity"){

      ctx.fillStyle="#05020b";

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.strokeStyle=b.color;
      ctx.lineWidth=4;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius+6,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    else if(b.type==="laser"){

      ctx.fillStyle="#ff416a";

      ctx.fillRect(
        -20,
        -2,
        40,
        4
      );

      ctx.fillStyle="#fff";

      ctx.fillRect(
        0,
        -1,
        22,
        2
      );
    }

    else if(b.type==="meteor"){

      ctx.beginPath();

      ctx.moveTo(
        b.radius,
        0
      );

      ctx.lineTo(
        -b.radius,
        -b.radius*.7
      );

      ctx.lineTo(
        -b.radius*.5,
        b.radius
      );

      ctx.lineTo(
        b.radius*.3,
        b.radius*.6
      );

      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle="#ffd08a";
      ctx.lineWidth=2;
      ctx.stroke();
    }

    else if(b.type==="twin"){

      ctx.fillRect(
        -12,
        -7,
        24,
        5
      );

      ctx.fillRect(
        -12,
        2,
        24,
        5
      );
    }

    else if(b.type==="shock"){

      ctx.strokeStyle=b.color;
      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius+4,
        0,
        Math.PI*2
      );

      ctx.stroke();

      ctx.fillStyle=b.color;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius*.35,
        0,
        Math.PI*2
      );

      ctx.fill();
    }

    else if(b.type==="dragon"){

      ctx.beginPath();

      ctx.moveTo(
        b.radius*1.8,
        0
      );

      ctx.lineTo(
        0,
        -b.radius
      );

      ctx.lineTo(
        -b.radius,
        -b.radius*.45
      );

      ctx.lineTo(
        -b.radius*.5,
        0
      );

      ctx.lineTo(
        -b.radius,
        b.radius*.45
      );

      ctx.lineTo(
        0,
        b.radius
      );

      ctx.closePath();
      ctx.fill();

      ctx.fillStyle="#ffd36a";

      ctx.beginPath();

      ctx.arc(
        b.radius,
        0,
        4,
        0,
        Math.PI*2
      );

      ctx.fill();
    }

    else if(b.type==="star"){

      drawStar(
        0,
        0,
        b.radius*1.8,
        b.radius*.75
      );
    }

    else if(b.type==="shadow"){

      ctx.fillStyle="#10091e";

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.strokeStyle="#b18aff";
      ctx.lineWidth=3;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius+5,
        .5,
        5.5
      );

      ctx.stroke();
    }

    else if(b.type==="rocket"){

      ctx.fillStyle="#d6dce5";

      ctx.fillRect(
        -b.radius,
        -b.radius*.4,
        b.radius*1.8,
        b.radius*.8
      );

      ctx.fillStyle="#ff4a32";

      ctx.beginPath();

      ctx.moveTo(
        b.radius*.8,
        -b.radius*.4
      );

      ctx.lineTo(
        b.radius*1.4,
        0
      );

      ctx.lineTo(
        b.radius*.8,
        b.radius*.4
      );

      ctx.closePath();
      ctx.fill();

      ctx.fillStyle="#ffb13b";

      ctx.beginPath();

      ctx.moveTo(
        -b.radius,
        -4
      );

      ctx.lineTo(
        -b.radius*1.7,
        0
      );

      ctx.lineTo(
        -b.radius,
        4
      );

      ctx.closePath();
      ctx.fill();
    }

    else if(b.type==="solar"){

      ctx.fillStyle="#ffd63f";

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.strokeStyle="#fff3a0";
      ctx.lineWidth=3;

      for(let i=0;i<8;i++){

        const a=
          i*Math.PI/4;

        ctx.beginPath();

        ctx.moveTo(
          Math.cos(a)*(b.radius+3),
          Math.sin(a)*(b.radius+3)
        );

        ctx.lineTo(
          Math.cos(a)*(b.radius+10),
          Math.sin(a)*(b.radius+10)
        );

        ctx.stroke();
      }
    }

    else if(b.type==="nova"){

      ctx.fillStyle="#68dfff";

      ctx.beginPath();

      ctx.moveTo(
        b.radius*1.4,
        0
      );

      ctx.lineTo(
        0,
        -b.radius
      );

      ctx.lineTo(
        -b.radius*1.4,
        0
      );

      ctx.lineTo(
        0,
        b.radius
      );

      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle="#fff";
      ctx.lineWidth=2;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius+8,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    else if(b.type==="galaxy"){

      ctx.fillStyle="#42155d";

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.strokeStyle="#fff";
      ctx.lineWidth=2;

      ctx.beginPath();

      ctx.ellipse(
        0,
        0,
        b.radius+9,
        b.radius*.45,
        0,
        0,
        Math.PI*2
      );

      ctx.stroke();

      const now=
        performance.now()/220;

      for(let i=0;i<2;i++){

        const a=
          now+i*Math.PI;

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
          Math.cos(a)*(b.radius+9),
          Math.sin(a)*(b.radius*.45),
          3,
          0,
          Math.PI*2
        );

        ctx.fill();
      }
    }

    else if(b.type==="ultimate"){

      ctx.fillStyle="#fff";

      ctx.beginPath();

      ctx.moveTo(
        b.radius*1.7,
        0
      );

      ctx.lineTo(
        0,
        -b.radius*1.4
      );

      ctx.lineTo(
        -b.radius*1.7,
        0
      );

      ctx.lineTo(
        0,
        b.radius*1.4
      );

      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle="#6eeaff";
      ctx.lineWidth=3;
      ctx.stroke();

      ctx.strokeStyle="#ff63df";

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius+9,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    ctx.restore();
  }


  /* Enemy bullets */

  for(const b of enemyBullets){

    const sx=
      b.x-camera.x+W/2;

    const sy=
      b.y-camera.y+H/2;

    ctx.save();

    ctx.shadowBlur=22;
    ctx.shadowColor=
      b.color||"#ff5b30";

    ctx.fillStyle=
      b.color||"#ff743d";

    ctx.beginPath();

    ctx.arc(
      sx,
      sy,
      b.radius,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }
}


/* ================= SHOCKWAVES ================= */

function drawShockwaves(){

  for(const s of shockwaves){

    const sx=
      s.x-camera.x+W/2;

    const sy=
      s.y-camera.y+H/2;

    ctx.save();

    ctx.globalAlpha=
      Math.max(0,s.life);

    ctx.strokeStyle=s.color;
    ctx.lineWidth=7;

    ctx.shadowBlur=25;
    ctx.shadowColor=s.color;

    ctx.beginPath();

    ctx.arc(
      sx,
      sy,
      s.radius,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
  }
}


/* ================= LIGHTNING ================= */

function drawLightning(){

  for(const l of lightningEffects){

    const x1=
      l.x-camera.x+W/2;

    const y1=
      l.y-camera.y+H/2;

    const x2=
      (l.tx??l.x)-camera.x+W/2;

    const y2=
      (l.ty??l.y)-camera.y+H/2;

    ctx.save();

    ctx.globalAlpha=
      Math.max(0,l.life/.25);

    ctx.strokeStyle="#e9ffff";

    ctx.shadowBlur=25;
    ctx.shadowColor="#4defff";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(x1,y1);

    const mx=
      (x1+x2)/2+
      rand(-25,25);

    const my=
      (y1+y2)/2+
      rand(-25,25);

    ctx.lineTo(mx,my);
    ctx.lineTo(x2,y2);

    ctx.stroke();

    ctx.restore();
  }
}


/* ================= PARTICLES ================= */

function drawParticles(){

  for(const p of particles){

    const sx=
      p.x-camera.x+W/2;

    const sy=
      p.y-camera.y+H/2;

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/p.maxLife
      );

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.arc(
      sx,
      sy,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}


/* ================= FLOATING TEXT ================= */

function drawFloatingTexts(){

  ctx.textAlign="center";

  for(const t of floatingTexts){

    const sx=
      t.x-camera.x+W/2;

    const sy=
      t.y-camera.y+H/2;

    ctx.globalAlpha=
      Math.max(0,t.life);

    ctx.font="bold 16px Arial";
    ctx.fillStyle=t.color;

    ctx.fillText(
      t.text,
      sx,
      sy
    );
  }

  ctx.globalAlpha=1;
}

function updateUI(){

  hpText.textContent=
    Math.ceil(player.hp);

  killsEl.textContent=
    kills;

  coinsEl.textContent=
    Math.floor(player.coins);

  damageEl.textContent=
    Math.round(player.damage);

  levelText.textContent="1";

  bossText.textContent=
    bossNumber+" / 10";

  weaponName.textContent=
    currentWeapon.name;

  hpBar.style.width=
    Math.max(
      0,
      player.hp/player.maxHp*100
    )+"%";

  if(boss){

    bossHp.style.width=
      Math.max(
        0,
        boss.hp/boss.maxHp*100
      )+"%";
  }

  chosenWeapons.textContent=
    ownedWeapons.map(i=>{

      const u=
        weaponUpgrades[i];

      const fire=
        Math.round(
          (1-u.fireMult)*100
        );

      const dmg=
        u.damageBonus;

      let extra="";

      if(dmg>0||fire>0){

        extra=
          " ["+
          (dmg>0?"+"+dmg:"")+
          (dmg>0&&fire>0?" / ":"")+
          (fire>0?fire+"%":"")+
          "]";
      }

      return weapons[i].name+extra;

    }).join(" • ");
}


/* ================= MAIN UPDATE ================= */

function update(dt){

  if(!gameRunning)return;

  if(choiceOpen)return;

  if(messageTimer>0){

    messageTimer-=dt;

    if(messageTimer<=0){

      message.style.display="none";
    }
  }

  updatePlayer(dt);
  updateSpawning(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updateEnemyBullets(dt);
  updateBoss(dt);
  updateDelayedAttacks(dt);
  updateParticles(dt);
  updateFloatingTexts(dt);
  updateShockwaves(dt);
  updateWarnings(dt);
  updateLightning(dt);
  updateCamera();
  updateUI();
}

/* ================= GAME LOOP ================= */

let lastTime=performance.now();

function gameLoop(now){

  let dt=
    (now-lastTime)/1000;

  lastTime=now;

  dt=Math.min(dt,.033);

  update(dt);

  ctx.save();

  if(screenShake>0){

    ctx.translate(
      rand(-screenShake,screenShake),
      rand(-screenShake,screenShake)
    );

    screenShake*=.88;

    if(screenShake<.2){
      screenShake=0;
    }
  }

  draw();

  ctx.restore();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>
